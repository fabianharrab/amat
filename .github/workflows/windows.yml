# Builds the Windows version on every push and pull request. The zip is
# attached to the run as an artifact; pushing a tag like v0.1.0 also
# publishes it on the Releases page as "Amat-windows.zip".
name: Windows

on:
  push:
    branches: [master, windows]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and package
        shell: pwsh
        run: ./windows/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amat-windows
          path: dist/Amat-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Amat-windows.zip
